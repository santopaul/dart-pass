<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bus Pass — Mobile</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="ticket-app" role="main">
      <header class="top">
        <div class="brand">
          <h1>DART</h1>
          <p class="subtitle">Show operator your ticket</p>
        </div>
        <button class="close" aria-label="Close">✕</button>
      </header>

      <section class="logo-area" aria-hidden="true">
        <div class="logo-ring pulse" aria-hidden="true">
          <div class="logo-center">
            <img src="dart.png" alt="DART logo" class="logo" />
          </div>
        </div>
      </section>

      <section class="time-area" aria-live="polite">
        <div id="time" class="time">--:--:--</div>
      </section>

      <section class="card" id="ticket">
        <h2 class="fare">Regional Full Fare 4 Hour</h2>
        <p class="location">Detroit, MI</p>
        <p class="expires"><strong id="expires-text">Expires —</strong></p>
      </section>

      <footer class="spacer"></footer>
    </main>

    <script src="script.js"></script>
  </body>
</html>
